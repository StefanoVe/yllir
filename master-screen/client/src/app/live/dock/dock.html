<aside class="dock" [class.open]="open()" [attr.aria-label]="s.copy('live.dock.label')">
  @if (open()) {
    <section class="content" [attr.aria-label]="labelOf(tab())">
      <header class="panel-head">{{ labelOf(tab()) }}</header>
      @switch (tab()) {
        @case ('combat') { <ms-live-combat [snapshot]="snapshot()" /> }
        @case ('lookup') { <ms-live-lookup /> }
        @default { <ms-live-log [snapshot]="snapshot()" /> }
      }
    </section>
  }
  <nav class="bar" [attr.aria-label]="s.copy('live.dock.label')">
    @for (t of tabs; track t.id) {
      <button type="button" class="tab" [class.active]="open() && tab() === t.id"
        [attr.aria-pressed]="open() && tab() === t.id"
        [attr.aria-label]="badgeOf(t.id) ? s.copy(t.label) + ', ' + badgeOf(t.id) : s.copy(t.label)" [title]="s.copy(t.label)"
        (click)="tabSelect.emit(t.id)">
        <span class="pill" aria-hidden="true">
          <lucide-angular [img]="t.icon" [size]="20" aria-hidden="true" />
        </span>
        @if (badgeOf(t.id)) {
          <span class="badge" aria-hidden="true">{{ badgeOf(t.id) }}</span>
        }
      </button>
    }
    <button type="button" class="tab collapse" [attr.aria-label]="open() ? s.copy('live.dock.collapse') : s.copy('live.dock.expand')"
      [title]="open() ? s.copy('live.dock.collapse') : s.copy('live.dock.expand')" (click)="toggle.emit()">
      <lucide-angular [img]="open() ? icons.PanelRightClose : icons.PanelRightOpen" [size]="20" aria-hidden="true" />
    </button>
  </nav>
</aside>
