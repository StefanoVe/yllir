<div class="toolbar" role="toolbar" [attr.aria-label]="s.copy('live.tool.toolbar')">
  <button type="button" class="tool" [attr.aria-label]="s.copy('live.tool.note')" [title]="s.copy('live.tool.note')" (click)="command.emit('note')">
    <lucide-angular [img]="icons.StickyNote" [size]="18" aria-hidden="true" />
  </button>
  <button type="button" class="tool" [class.active]="documentActive()" [attr.aria-pressed]="documentActive()"
    [attr.aria-label]="s.copy('live.tool.document')" [title]="s.copy('live.tool.document')" (click)="command.emit('document')">
    <lucide-angular [img]="icons.FileText" [size]="18" aria-hidden="true" />
  </button>
  <button type="button" class="tool" [class.active]="imageActive()" [attr.aria-pressed]="imageActive()"
    [attr.aria-label]="s.copy('live.tool.image')" [title]="s.copy('live.tool.image')" (click)="command.emit('image')">
    <lucide-angular [img]="icons.Image" [size]="18" aria-hidden="true" />
  </button>
  <button type="button" class="tool" [attr.aria-label]="s.copy('live.tool.frame')" [title]="s.copy('live.tool.frame')" (click)="command.emit('frame')">
    <lucide-angular [img]="icons.Frame" [size]="18" aria-hidden="true" />
  </button>
  <button type="button" class="tool" [class.active]="linkActive()" [attr.aria-pressed]="linkActive()"
    [attr.aria-label]="linkActive() ? s.copy('live.tool.linkCancel') : s.copy('live.tool.link')"
    [title]="linkActive() ? s.copy('live.tool.linkCancel') : s.copy('live.tool.link')" (click)="command.emit('link')">
    <lucide-angular [img]="linkActive() ? icons.Unlink : icons.Link" [size]="18" aria-hidden="true" />
  </button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" class="tool" [attr.aria-label]="s.copy('live.tool.zoomOut')" [title]="s.copy('live.tool.zoomOut')" (click)="command.emit('zoom-out')">
    <lucide-angular [img]="icons.ZoomOut" [size]="18" aria-hidden="true" />
  </button>
  <span class="percent" aria-hidden="true">{{ percent() }}%</span>
  <button type="button" class="tool" [attr.aria-label]="s.copy('live.tool.zoomIn')" [title]="s.copy('live.tool.zoomIn')" (click)="command.emit('zoom-in')">
    <lucide-angular [img]="icons.ZoomIn" [size]="18" aria-hidden="true" />
  </button>
  <button type="button" class="tool" [attr.aria-label]="s.copy('live.tool.fit')" [title]="s.copy('live.tool.fit')" (click)="command.emit('fit')">
    <lucide-angular [img]="icons.Maximize" [size]="18" aria-hidden="true" />
  </button>
  <span class="sep" aria-hidden="true"></span>
  <span class="save" role="img" [attr.aria-label]="saveLabel()" [title]="saveLabel()" [class.warn]="status() === 'error' || status() === 'conflict'">
    @switch (status()) {
      @case ('saving') { <lucide-angular [img]="icons.LoaderCircle" [size]="18" class="spin" aria-hidden="true" /> }
      @case ('pending') { <lucide-angular [img]="icons.LoaderCircle" [size]="18" aria-hidden="true" /> }
      @case ('error') { <lucide-angular [img]="icons.CloudOff" [size]="18" aria-hidden="true" /> }
      @case ('conflict') { <lucide-angular [img]="icons.CircleAlert" [size]="18" aria-hidden="true" /> }
      @default { <lucide-angular [img]="icons.Cloud" [size]="18" aria-hidden="true" /> }
    }
  </span>
</div>
