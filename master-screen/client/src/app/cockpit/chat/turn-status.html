@if(turn();as t){
<div class="turn-status">
  <span class="steps" [class.running]="t.status==='running'" aria-hidden="true"><i></i><i></i><i></i><i></i></span
  ><ui-icon [name]="icon(t)" [size]="16" /><span class="label">{{label(t)}}</span
  ><span class="numeric">{{seconds()}}s</span>@if(queued()){<small>{{ i18n.t("liveAgent.turn.queued", { n: queued() }) }}</small>}<button
    class="btn btn-secondary stop"
    [msTooltip]="i18n.t('liveAgent.turn.stop')"
    [attr.aria-label]="i18n.t('liveAgent.turn.stop')"
    (click)="stop()"
  >
    <ui-icon name="stop" [size]="16" />
  </button>
</div>
}
