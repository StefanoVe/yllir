<header class="bar">
  <button type="button" class="icon" [attr.aria-label]="s.text('panels.lookup.back')" [title]="s.text('panels.lookup.back')" (click)="back.emit()">
    <lucide-angular [img]="icons.ArrowLeft" [size]="18" aria-hidden="true" />
  </button>
  <span class="title">{{ doc()?.title ?? path() }}</span>
  @if (doc()?.masterOnly) {
    <span class="master" role="img" [attr.aria-label]="s.text('panels.common.masterOnly')" [title]="s.text('panels.common.masterOnly')">
      <lucide-angular [img]="icons.EyeOff" [size]="16" aria-hidden="true" />
    </span>
  }
  <a class="icon" [routerLink]="fullPageLink()" [attr.aria-label]="s.text('panels.lookup.openFull')" [title]="s.text('panels.lookup.openFull')">
    <lucide-angular [img]="icons.ExternalLink" [size]="18" aria-hidden="true" />
  </a>
  <span class="handle" draggable="true" role="img" [attr.aria-label]="s.text('panels.lookup.drag')" [title]="s.text('panels.lookup.drag')"
        (dragstart)="onHandleDragStart($event)">
    <lucide-angular [img]="icons.GripVertical" [size]="18" aria-hidden="true" />
  </span>
</header>

@if (error(); as message) {
  <p class="notice" role="alert">{{ message }}</p>
} @else if (loading()) {
  <p class="notice" role="status">{{ s.text('panels.common.loading') }}</p>
} @else if (doc(); as d) {
  @if (d.blocks.length === 0) {
    <p class="notice">{{ s.text('panels.lookup.noBody') }}</p>
  } @else {
    <article class="body" (click)="onBodyClick($event)">
      <ms-doc-body [blocks]="d.blocks" />
    </article>
  }
}
