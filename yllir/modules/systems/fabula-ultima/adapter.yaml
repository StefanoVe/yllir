id: fabula-ultima
name: "Fabula Ultima"
version: 1
headings:
  statistics:
    it: Statistiche
    en: Statistics
  description:
    it: Descrizione
    en: Description
  brief:
    it: In breve
    en: In brief
  effects:
    it: Effetti
    en: Effects
encounters: turn-based
encounter_ops: encounter.mjs
progression:
  method: experience
  experience_points: true
# Attributes are die sizes; a status lowers each attribute it names by one size, never below the floor.
attributes:
  ids: [dex, ins, mig, wlp]
  dice: [6, 8, 10, 12]
  floor: 6
difficulty:
  method: level-offset
  bands: [easy, normal, hard]
  ops: difficulty.mjs
  level_offsets:
    easy: 0
    normal: 5
    hard: 10
resources:
  - id: hp
    recovery: rest
  - id: mp
    recovery: rest
  - id: ip
    recovery: rest
# Points gained and spent by event, without a maximum or a rest; owner is the tracker side that holds them.
pools:
  - id: fabula
    owner: [pc]
    label:
      it: Punti Fabula
      en: Fabula Points
  - id: ultima
    owner: [enemy]
    label:
      it: Punti Ultima
      en: Ultima Points
conditions:
  - slow
  - dazed
  - weak
  - shaken
  - enraged
  - poisoned
condition_durations: [until_removed]
condition_labels:
  slow:
    it: Lento
    en: Slow
  dazed:
    it: Confuso
    en: Dazed
  weak:
    it: Debole
    en: Weak
  shaken:
    it: Scosso
    en: Shaken
  enraged:
    it: Furente
    en: Enraged
  poisoned:
    it: Avvelenato
    en: Poisoned
duration_labels:
  until_removed:
    it: finché non viene rimosso
    en: until removed
condition_effects:
  slow: [dex]
  dazed: [ins]
  weak: [mig]
  shaken: [wlp]
  enraged: [dex, ins]
  poisoned: [mig, wlp]
creature_sheet:
  section: statistics
  required:
    - id: level
      label_it: Livello
      label_en: Level
    - id: rank
      label_it: Grado
      label_en: Rank
    - id: hp
      label_it: PV
      label_en: HP
    - id: mp
      label_it: PM
      label_en: MP
    - id: dex
      label_it: DES
      label_en: DEX
    - id: ins
      label_it: INT
      label_en: INS
    - id: mig
      label_it: VIG
      label_en: MIG
    - id: wlp
      label_it: VOL
      label_en: WLP
    - id: def
      label_it: Difesa
      label_en: Defense
    - id: mdef
      label_it: Difesa Magica
      label_en: Magic Defense
  optional: [species, traits, affinities, basic_attacks, skills, spells, ultima_points, villain]
action_table: [attacchi e capacità, attacks and abilities]
checks: checks.mjs
item_sheet:
  mechanical_fields: [cost, category, quality, accuracy, damage, defense, magic_defense]
do_not:
  - roll dice for the master
  - choose targets
  - decide the outcome of checks, opposed checks or attacks
  - "run random tables (such as Gamble or ingredients): name them, the master rolls"
  - spend Fabula Points or Ultima Points for the master or the players
  - add affinities (resistance, immunity, absorption, vulnerability) the sheet does not declare
  - rewrite a player character sheet
