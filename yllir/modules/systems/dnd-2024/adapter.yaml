id: dnd-2024
name: "D&D 2024"
version: 1
headings:
  statistics:
    it: Statistiche
    en: Statistics
  description:
    it: Descrizione
    en: Description
  brief:
    it: In breve
    en: In brief
  effects:
    it: Effetti
    en: Effects
encounters: turn-based
encounter_ops: encounter.mjs
battle_grid:
  square: 5
  unit: ft
progression:
  method: milestone
  experience_points: false
difficulty:
  method: band-and-cr
  bands: [low, moderate, high]
  ops: difficulty.mjs
  # Rows [character level, low, moderate, high]: XP budget per character (D&D 2024).
  budget_per_character:
    - [1, 50, 75, 100]
    - [2, 100, 150, 200]
    - [3, 150, 225, 400]
    - [4, 250, 375, 500]
    - [5, 500, 750, 1100]
    - [6, 600, 1000, 1400]
    - [7, 750, 1300, 1700]
    - [8, 1000, 1700, 2100]
    - [9, 1300, 2000, 2600]
    - [10, 1600, 2300, 3100]
    - [11, 1900, 2900, 4100]
    - [12, 2200, 3700, 4700]
    - [13, 2600, 4200, 5400]
    - [14, 2900, 4900, 6200]
    - [15, 3300, 5400, 7800]
    - [16, 3800, 6100, 9800]
    - [17, 4500, 7200, 11700]
    - [18, 5000, 8700, 14200]
    - [19, 5500, 10700, 17200]
    - [20, 6400, 13200, 22000]
  # Rows [challenge rating, XP]. The rating is quoted so that "0" and "1/8" stay text.
  cr_xp:
    - ["0", 10]
    - ["1/8", 25]
    - ["1/4", 50]
    - ["1/2", 100]
    - ["1", 200]
    - ["2", 450]
    - ["3", 700]
    - ["4", 1100]
    - ["5", 1800]
    - ["6", 2300]
    - ["7", 2900]
    - ["8", 3900]
    - ["9", 5000]
    - ["10", 5900]
    - ["11", 7200]
    - ["12", 8400]
    - ["13", 10000]
    - ["14", 11500]
    - ["15", 13000]
    - ["16", 15000]
    - ["17", 18000]
    - ["18", 20000]
    - ["19", 22000]
    - ["20", 25000]
    - ["21", 33000]
    - ["22", 41000]
    - ["23", 50000]
    - ["24", 62000]
    - ["25", 75000]
    - ["26", 90000]
    - ["27", 105000]
    - ["28", 120000]
    - ["29", 135000]
    - ["30", 155000]
economy:
  reference_item:
    it: Razione (un giorno)
    en: Rations (one day)
resources:
  - id: hp
    recovery: rest
  - id: temp_hp
    recovery: never
  - id: spell_slots
    recovery: long_rest
  - id: limited_uses
    recovery: declared_by_sheet
  - id: recharge
    recovery: declared_by_sheet
  - id: legendary_actions
    recovery: turn
  - id: reactions
    recovery: round
conditions:
  - blinded
  - charmed
  - deafened
  - exhaustion
  - frightened
  - grappled
  - incapacitated
  - invisible
  - paralyzed
  - petrified
  - poisoned
  - prone
  - restrained
  - stunned
  - unconscious
condition_durations: [end_of_turn, until_save, until_rest, until_removed, rounds]
condition_labels:
  blinded:
    it: Accecato
    en: Blinded
  charmed:
    it: Affascinato
    en: Charmed
  deafened:
    it: Assordato
    en: Deafened
  exhaustion:
    it: Indebolimento
    en: Exhaustion
  frightened:
    it: Spaventato
    en: Frightened
  grappled:
    it: Afferrato
    en: Grappled
  incapacitated:
    it: Incapacitato
    en: Incapacitated
  invisible:
    it: Invisibile
    en: Invisible
  paralyzed:
    it: Paralizzato
    en: Paralyzed
  petrified:
    it: Pietrificato
    en: Petrified
  poisoned:
    it: Avvelenato
    en: Poisoned
  prone:
    it: Prono
    en: Prone
  restrained:
    it: Trattenuto
    en: Restrained
  stunned:
    it: Stordito
    en: Stunned
  unconscious:
    it: Privo di sensi
    en: Unconscious
duration_labels:
  end_of_turn:
    it: fino alla fine del suo turno
    en: until the end of its turn
  until_save:
    it: fino a un tiro salvezza
    en: until a save
  until_rest:
    it: fino a un riposo
    en: until a rest
  until_removed:
    it: finché non viene rimossa
    en: until removed
  rounds:
    it: per alcuni round
    en: for some rounds
action_table: [attacchi e capacità, attacks and abilities]
action_groups:
  - id: actions
    timing: own_turn
    label:
      it: Azioni
      en: Actions
    headings: [azioni, actions]
    markers: [azione, action]
  - id: bonus_actions
    timing: own_turn
    label:
      it: Azioni bonus
      en: Bonus actions
    headings: [azioni bonus, bonus actions]
    markers: [azione bonus, bonus action]
  - id: reactions
    timing: any_turn
    label:
      it: Reazioni
      en: Reactions
    headings: [reazioni, reactions]
    markers: [reazione, reaction]
  - id: legendary_actions
    timing: others_turns
    label:
      it: Azioni leggendarie
      en: Legendary actions
    headings: [azioni leggendarie, legendary actions]
    markers: [azione leggendaria, legendary action]
creature_sheet:
  section: statistics
  required:
    - id: ac
      label_it: CA
      label_en: AC
    - id: hp
      label_it: PF
      label_en: HP
    - id: speed
      label_it: Velocità
      label_en: Speed
    - id: str
      label_it: FOR
      label_en: STR
    - id: dex
      label_it: DES
      label_en: DEX
    - id: con
      label_it: COS
      label_en: CON
    - id: int
      label_it: INT
      label_en: INT
    - id: wis
      label_it: SAG
      label_en: WIS
    - id: cha
      label_it: CAR
      label_en: CHA
  optional: [saves, skills, senses, proficiency_bonus, resistances, immunities, initiative, cr, phases, recharge_abilities, limited_uses, legendary_actions, reactions, traits, defeat_effects]
checks: checks.mjs
item_sheet:
  mechanical_fields: [activation, check, dc, duration, limits, resources, attunement, charges, frequency, bonus, dice, conditions, value]
  printable_fields: [title, description]
tracking: [initiative_order, phases_with_thresholds, recharges, reactions]
do_not:
  - roll dice for the master
  - choose targets
  - decide the outcome of attacks, saves or checks
  - add resistances, immunities or reductions the sheet does not declare
  - rewrite a player character sheet
