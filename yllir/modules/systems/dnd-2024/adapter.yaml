id: dnd-2024
name: "D&D 2024"
version: 1
headings:
  statistics:
    it: Statistiche
    en: Statistics
  description:
    it: Descrizione
    en: Description
  brief:
    it: In breve
    en: In brief
  effects:
    it: Effetti
    en: Effects
encounters: turn-based
encounter_ops: encounter.mjs
battle_grid:
  square: 5
  unit: ft
progression:
  method: milestone
  experience_points: false
difficulty:
  method: band-and-cr
  bands: [low, moderate, high]
resources:
  - id: hp
    recovery: rest
  - id: temp_hp
    recovery: never
  - id: spell_slots
    recovery: long_rest
  - id: limited_uses
    recovery: declared_by_sheet
  - id: recharge
    recovery: declared_by_sheet
  - id: legendary_actions
    recovery: turn
  - id: reactions
    recovery: round
conditions:
  - blinded
  - charmed
  - deafened
  - exhaustion
  - frightened
  - grappled
  - incapacitated
  - invisible
  - paralyzed
  - petrified
  - poisoned
  - prone
  - restrained
  - stunned
  - unconscious
condition_durations: [end_of_turn, until_save, until_rest, until_removed, rounds]
condition_labels:
  blinded:
    it: Accecato
    en: Blinded
  charmed:
    it: Affascinato
    en: Charmed
  deafened:
    it: Assordato
    en: Deafened
  exhaustion:
    it: Indebolimento
    en: Exhaustion
  frightened:
    it: Spaventato
    en: Frightened
  grappled:
    it: Afferrato
    en: Grappled
  incapacitated:
    it: Incapacitato
    en: Incapacitated
  invisible:
    it: Invisibile
    en: Invisible
  paralyzed:
    it: Paralizzato
    en: Paralyzed
  petrified:
    it: Pietrificato
    en: Petrified
  poisoned:
    it: Avvelenato
    en: Poisoned
  prone:
    it: Prono
    en: Prone
  restrained:
    it: Trattenuto
    en: Restrained
  stunned:
    it: Stordito
    en: Stunned
  unconscious:
    it: Privo di sensi
    en: Unconscious
duration_labels:
  end_of_turn:
    it: fino alla fine del suo turno
    en: until the end of its turn
  until_save:
    it: fino a un tiro salvezza
    en: until a save
  until_rest:
    it: fino a un riposo
    en: until a rest
  until_removed:
    it: finché non viene rimossa
    en: until removed
  rounds:
    it: per alcuni round
    en: for some rounds
action_table: [attacchi e capacità, attacks and abilities]
action_groups:
  - id: actions
    timing: own_turn
    label:
      it: Azioni
      en: Actions
    headings: [azioni, actions]
    markers: [azione, action]
  - id: bonus_actions
    timing: own_turn
    label:
      it: Azioni bonus
      en: Bonus actions
    headings: [azioni bonus, bonus actions]
    markers: [azione bonus, bonus action]
  - id: reactions
    timing: any_turn
    label:
      it: Reazioni
      en: Reactions
    headings: [reazioni, reactions]
    markers: [reazione, reaction]
  - id: legendary_actions
    timing: others_turns
    label:
      it: Azioni leggendarie
      en: Legendary actions
    headings: [azioni leggendarie, legendary actions]
    markers: [azione leggendaria, legendary action]
creature_sheet:
  section: statistics
  required:
    - id: ac
      label_it: CA
      label_en: AC
    - id: hp
      label_it: PF
      label_en: HP
    - id: speed
      label_it: Velocità
      label_en: Speed
    - id: str
      label_it: FOR
      label_en: STR
    - id: dex
      label_it: DES
      label_en: DEX
    - id: con
      label_it: COS
      label_en: CON
    - id: int
      label_it: INT
      label_en: INT
    - id: wis
      label_it: SAG
      label_en: WIS
    - id: cha
      label_it: CAR
      label_en: CHA
  optional: [saves, skills, senses, proficiency_bonus, resistances, immunities, initiative, cr, phases, recharge_abilities, limited_uses, legendary_actions, reactions, traits, defeat_effects]
checks: checks.mjs
item_sheet:
  mechanical_fields: [activation, check, dc, duration, limits, resources, attunement, charges, frequency, bonus, dice, conditions, value]
  printable_fields: [title, description]
tracking: [initiative_order, phases_with_thresholds, recharges, reactions]
do_not:
  - roll dice for the master
  - choose targets
  - decide the outcome of attacks, saves or checks
  - add resistances, immunities or reductions the sheet does not declare
  - rewrite a player character sheet
