case: new-campaign-all-answers
prompt: |
  Ciao! Voglio creare una campagna nuova.
  1) Si chiama «Le isole di vetro» e scriviamo in italiano.
  2) Usiamo un sistema nostro, niente regole di un gioco preciso.
  3) Il tono delle descrizioni deve essere asciutto.
  4) Il mondo si chiama Selvaria: un arcipelago di isole di vetro dove le tempeste cantano. I giocatori sono contrabbandieri che cercano un faro perduto.
  Va bene tutto così: procedi pure senza chiedermi altro.
expected:
  name: "Le isole di vetro"
  language: it
  register: plain
  world: Selvaria
  world_file: "Mondo/Selvaria.md"
  premise_words: [arcipelago, vetro, tempeste, contrabbandieri, faro]
  allowed_proper_nouns: [Selvaria, Le, I]
  version_message: "Creata la campagna «Le isole di vetro»"
limits:
  max_minutes: 4
  max_tool_calls: 60
