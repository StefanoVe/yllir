kind: create-asks
# Runs with the create-asks grader:
# A1: the final message ends with a question, written in Italian.
# A2: no layer of the atlas is locked.
# A3: every name and label text in the atlas files is the title of a sheet, or nothing.
# A4: the final message uses none of these words (whole words, any case).
# A5: the atlas manifest scope kind is settlement (passes when there is no manifest yet).
# A6: no terrain, relief or places layer file exists in the atlas folder (passes when there is no atlas folder).
forbidden_words: [script, JSON, seed, canvas, hash, lock, constraint]
expect_scope_kind: settlement
forbidden_layer_files: [terrain.json, relief.json, places.json, routes.json, biomes.json, political.json, water.json]
