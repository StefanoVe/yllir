# Terms that must not appear in the core of the framework (author decision 2026-11-21).
# Read by testbench/runners/check-core-purity.mjs.
scan:            # folders scanned, relative to the repo root
  - yllir/scripts
  - yllir/skills
  - yllir/agents
  - yllir/templates
exclude:         # path prefixes skipped
  - yllir/modules
terms:           # case-insensitive, matched on word boundaries
  - D&D
  - DnD
  - dnd-2024
  - dnd
  - 5e
  - Dungeons & Dragons
  - Fabula Ultima
  - fabula-ultima
  - Pathfinder
  - Morvalle
  - Valdaspra
  - Bornago
  - Ostrava
  - Le ceneri della valle
  - Il faro di Tessa
# justified exceptions: file (repo-relative), term, reason.
# A file ending in "/" is a prefix; term "*" allows every term. Only test code
# that exercises an adapter by id is allowed here. Fixture world names used as
# sample data and prose in SKILL.md, templates and comments are NOT allowed:
# they stay as hits for the author to decide.
allow:
  - file: yllir/scripts/lib/adapter.test.mjs
    term: D&D
    reason: test exercises the dnd-2024 adapter
  - file: yllir/scripts/lib/adapter.test.mjs
    term: dnd-2024
    reason: test exercises the dnd-2024 adapter
  - file: yllir/scripts/lib/adapter.test.mjs
    term: Fabula Ultima
