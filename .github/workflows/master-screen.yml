name: master-screen

on:
  push:
    branches: [main]
    paths: ['master-screen/**', '.github/workflows/master-screen.yml']
  pull_request:
    paths: ['master-screen/**', '.github/workflows/master-screen.yml']
  workflow_dispatch:

# Two releases never race for the same tag.
concurrency:
  group: master-screen-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # contents: write is used only to create the GitHub Release on push to main.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check the pin matches master-screen/VERSION
        run: |
          set -euo pipefail
          V=$(sh master-screen/scripts/version.sh)
          EXPECTED_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/master-screen-v$V/yllir-master-screen-$V.tar.gz"
          export V EXPECTED_URL
          node -e '
            const fs = require("node:fs");
            const pin = JSON.parse(fs.readFileSync("yllir/master-screen.json", "utf8"));
            const v = process.env.V;
            const url = process.env.EXPECTED_URL;
            const errors = [];
            if (pin.version !== v) {
              errors.push(`yllir/master-screen.json has version "${pin.version}" but master-screen/VERSION is "${v}".`);
            }
            if (pin.url !== url) {
              errors.push(`yllir/master-screen.json has url "${pin.url}" but it must be "${url}".`);
            }
            if (errors.length > 0) {
              for (const e of errors) console.error(`Pin mismatch: ${e}`);
              console.error("Set both master-screen/VERSION and yllir/master-screen.json to the same version in the commit.");
              process.exit(1);
            }
            console.log(`The pin matches master-screen/VERSION (${v}).`);
          '

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Server install, typecheck, test and build
        working-directory: master-screen/server
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Client install, build and tests
        if: hashFiles('master-screen/client/package.json') != ''
        working-directory: master-screen/client
        run: |
          npm ci
          npm run build
          npm run test:unit

      - name: Version, package and reproducibility check
        run: |
          set -euo pipefail
          test -f master-screen/dist/server.mjs
          test -d master-screen/client/dist/client/browser
          V=$(sh master-screen/scripts/version.sh)
          NAME="yllir-master-screen-$V.tar.gz"
          # Packing twice must give the same bytes; the release uses the first pack.
          sh master-screen/scripts/pack.sh "$V" "$RUNNER_TEMP/pack-1" > "$RUNNER_TEMP/pack-1.txt"
          sh master-screen/scripts/pack.sh "$V" "$RUNNER_TEMP/pack-2" > "$RUNNER_TEMP/pack-2.txt"
          cat "$RUNNER_TEMP/pack-1.txt"
          if ! cmp -s "$RUNNER_TEMP/pack-1.txt" "$RUNNER_TEMP/pack-2.txt"; then
            echo "The package is not reproducible: sha256 or size differ between two packs." >&2
            exit 1
          fi
          SHA=$(sed -n 's/^sha256=//p' "$RUNNER_TEMP/pack-1.txt")
          SIZE=$(sed -n 's/^size=//p' "$RUNNER_TEMP/pack-1.txt")
          (cd "$RUNNER_TEMP/pack-1" && sha256sum "$NAME" > "$NAME.sha256")
          {
            echo "VERSION=$V"
            echo "TAG=master-screen-v$V"
            echo "ASSET=$NAME"
            echo "PKG=$RUNNER_TEMP/pack-1/$NAME"
            echo "SUMFILE=$RUNNER_TEMP/pack-1/$NAME.sha256"
          } >> "$GITHUB_ENV"
          echo "Packed $NAME ($SIZE bytes, sha256 $SHA)"

      - name: Publish the GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::Release $TAG already exists: bump master-screen/VERSION and the pin in the commit to publish a new one."
            exit 0
          fi
          gh release create "$TAG" "$PKG" "$SUMFILE" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Master screen $VERSION" \
            --notes "Master screen package $VERSION, built from commit $GITHUB_SHA. The Yllir launcher downloads it as pinned in yllir/master-screen.json and checks it against the .sha256 asset."
